name: Android Foss

on:
  push:
    branches: [feature/foss*, release/foss*, foss]
  workflow_dispatch:

env:
  REACT_NATIVE_ARCHS: arm64-v8a

jobs:
  foss-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Install JS dependencies
        run: npm ci --include=dev

      - name: Generate native project (foss)
        run: FLAVOR=foss npx expo prebuild --platform android --clean --no-install

      - name: Restore upload keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Configure release signing
        run: node .github/scripts/patch-signing.js
        env:
          KEYSTORE_FILE: ../../android-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease -PreactNativeArchitectures=$REACT_NATIVE_ARCHS --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: psymap-foss-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: psymap-foss-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
